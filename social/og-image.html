<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Immagine social 1200x630</title>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url(../assets/fonts/plus-jakarta-sans-latin.woff2) format("woff2");font-weight:200 800}
@font-face{font-family:"Source Serif 4";src:url(../assets/fonts/source-serif-4-latin.woff2) format("woff2");font-weight:200 900}
html,body{margin:0}
.og{width:1200px;height:630px;position:relative;overflow:hidden;display:flex;background:linear-gradient(135deg,#112531,#0b1821);color:#edf6f8;font-family:"Plus Jakarta Sans",sans-serif}
.og:before{content:"";position:absolute;right:-140px;top:-180px;width:560px;height:560px;border-radius:50%;background:#58c6a2;opacity:.09}
.text{flex:1;padding:56px 40px 56px 76px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.kicker{color:#7ee4be;font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:20px}
h1{font-family:"Source Serif 4",serif;font-size:62px;line-height:1.08;font-weight:600;margin:22px 0 22px}
.text p{margin:0;font-size:26px;line-height:1.45;color:#cbd8d2}
.pill{align-self:flex-start;margin-top:32px;padding:15px 30px;border-radius:18px;background:linear-gradient(135deg,#8cebc7,#58c6a2);color:#06110d;font-weight:800;font-size:23px}
.photo{width:410px;margin:40px 52px 40px 0;border-radius:36px;overflow:hidden;position:relative;flex:none}
.photo img.p{width:100%;height:100%;object-fit:cover;object-position:56% 25%;display:block}
.logo{position:absolute;left:16px;top:16px;background:#fff;border-radius:16px;padding:8px 14px}
.logo img{height:38px;width:auto;display:block}
</style>
</head>
<body>
<div class="og">
  <div class="text">
    <div class="kicker">Federico Croletti · Milano</div>
    <h1>Il tuo lavoro merita di essere visto come si deve.</h1>
    <p>Siti web, landing page e assistenza informatica per professionisti e piccole attività.</p>
    <div class="pill">Scrivimi su WhatsApp</div>
  </div>
  <div class="photo">
    <img class="p" src="../assets/federico.webp" alt="">
    <div class="logo"><img src="../assets/logo.webp" alt=""></div>
  </div>
</div>
</body>
</html>
