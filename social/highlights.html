<!doctype html>
<html lang="it">
<head>

<title>Copertine Storie in evidenza 1080x1920</title>
<style>

.cover{width:1080px;height:1920px;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#112531,#0b1821);position:relative;overflow:hidden}
.cover.on{display:flex}
.cover:before{content:"";position:absolute;right:-220px;top:300px;width:700px;height:700px;border-radius:50%;background:#58c6a2;opacity:.08}
/* Instagram ritaglia al centro un cerchio di 1080 px: l'elemento resta nei 760 px centrali */
.ring{width:640px;height:640px;border-radius:50%;border:8px solid #58c6a2;background:rgba(88,198,162,.1);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
svg{width:340px;height:340px;fill:none;stroke:#7ee4be;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.accent{stroke:#edf6f8}
</style>
</head>
